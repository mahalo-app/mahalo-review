<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahalo from Lanna</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: one narrow phone-first column — tip card on top, review button below */
:root{
  --bg:#f6f8f7; --card:#ffffff; --fg:#1d2a2a; --muted:#5b6b6a; --line:#dde5e3;
  --hibiscus:#c2362b; --lagoon:#0f6b6b; --ta:#34e0a1; --ta-ink:#0b1f17;
  --display:"Young Serif",Georgia,serif; --body:"DM Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --card:#172221; --fg:#e8efed; --muted:#9db0ad; --line:#2a3a38;
  --hibiscus:#ff7a6b; --lagoon:#1f8a84; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --card:#172221; --fg:#e8efed; --muted:#9db0ad; --line:#2a3a38;
  --hibiscus:#ff7a6b; --lagoon:#1f8a84; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:460px;margin:0 auto;padding-block:32px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
.tip{display:flex;flex-direction:column;gap:14px;font-size:1.15rem;color:var(--fg);text-align:center}
.tip p{margin:0;color:var(--fg)}
h1{font-family:var(--display);font-weight:400;font-size:1.8rem;line-height:1.2;margin:4px 0;color:var(--hibiscus);text-wrap:balance}
.ways{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.way{display:flex}
.way a.val{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px;border-radius:14px;
  background:var(--lagoon);color:#fff;text-decoration:none;font-size:1.4rem;font-weight:700;overflow-wrap:anywhere}
.way a.val small{font-size:1rem;font-weight:500;opacity:.9}
.way a.val:hover{filter:brightness(1.08)}
.copy{flex:none;font:inherit;font-size:.7rem;font-weight:700;color:var(--lagoon);background:none;border:1px solid var(--line);border-radius:6px;padding:1px 6px;cursor:pointer}
.copy:focus-visible,.ta:focus-visible,a.val:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px}
.review{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:8px}
.review h2{font-family:var(--body);font-weight:400;font-size:1.9rem;line-height:1.25;margin:0;color:var(--muted);text-wrap:balance}
.review h2 b{color:var(--fg)}
.ta{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.ta .dot{width:150px;height:150px;border-radius:50%;background:var(--ta);display:grid;place-items:center;color:var(--ta-ink);font-weight:700;font-size:1.3rem;letter-spacing:.02em;transition:transform .15s}
.ta:hover .dot{transform:scale(1.05)}
.ta .dot img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ta .name{font-weight:700;font-size:2.8rem;letter-spacing:-.01em;line-height:1}
.note{font-size:.85rem;color:var(--hibiscus);margin:0}
@media (prefers-reduced-motion:reduce){.ta .dot{transition:none}}
</style>
</head>
<body>

<main class="wrap">
  <section class="tip">
    <p>If you'd like to show appreciation to your student server, you can help support them by leaving a tip on the table or below.</p>
    <h1>🌺 Mahalo for your support!</h1>
    <ul class="ways">
      <li class="way"><a class="val" href="https://account.venmo.com/u/lannamae28" target="_blank" rel="noopener">Venmo<small>@lannamae28</small></a></li>
      <li class="way"><a class="val" href="https://www.paypal.me/LannaMaeEleazar" target="_blank" rel="noopener">PayPal<small>LannaMaeEleazar</small></a></li>
    </ul>
  </section>

  <section class="review">
    <h2>Please <b>click</b> the logo to leave a review.</h2>
    <a class="ta" id="review-link" href="#" target="_blank" rel="noopener">
      <span class="dot"><img src="logo.png" alt="Leave a review" onerror="this.replaceWith('Review')"></span>
      <span class="name">Tripadvisor</span>
    </a>
    <p class="note" id="link-note" hidden>Review link not set up yet.</p>
  </section>
</main>

<script>
// Paste the exact link from the QR code between the quotes:
const REVIEW_URL = "https://polynesia.az1.qualtrics.com/jfe/form/SV_aaBPITVI007rveu?location=Aloha&server=Aloha03";
const a = document.getElementById("review-link");
if (REVIEW_URL) { a.href = REVIEW_URL; }
else { a.removeAttribute("href"); document.getElementById("link-note").hidden = false; }

document.querySelectorAll(".copy").forEach(btn => {
  btn.addEventListener("click", () => {
    const done = () => { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy", 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("zelle")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(btn.dataset.copy).then(done, fallback); } catch (e) { fallback(); }
  });
});
</script>
</body>
</html>
